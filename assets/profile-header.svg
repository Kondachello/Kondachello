<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Александр Кондаков — ML-инженер</title>
  <desc id="desc">Персональный заголовок профиля с ключевыми результатами</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.58" stop-color="#0d1728"/>
      <stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path d="M0 275C172 222 278 308 440 257S742 195 1200 250" fill="none" stroke="#22d3ee" stroke-opacity="0.09" stroke-width="2"/>
  <path d="M0 294C180 242 301 321 469 275S790 221 1200 270" fill="none" stroke="#8b5cf6" stroke-opacity="0.10"/>

  <!-- Рисованная монограмма AK -->
  <g transform="translate(48 45)" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M18 216L85 22l67 194M45 139h82" stroke-width="10"/>
    <path d="M174 22v194M176 126l82-104M176 126l88 90" stroke-width="10"/>
  </g>
  <rect x="304" y="50" width="2" height="220" rx="1" fill="#334155"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="346" y="104" fill="#f8fafc" font-size="42" font-weight="700" letter-spacing="1.2">АЛЕКСАНДР КОНДАКОВ</text>
    <text x="348" y="145" fill="#94a3b8" font-size="20" font-weight="500" letter-spacing="2.4">ML · LLM · RECSYS · MLOPS</text>
    <text x="348" y="179" fill="#cbd5e1" font-size="16">ИТМО · строю ML-системы от эксперимента до продакшена</text>

    <g transform="translate(346 213)">
      <rect width="204" height="47" rx="12" fill="#111e33" stroke="#22d3ee" stroke-opacity="0.34"/>
      <text x="18" y="20" fill="#67e8f9" font-size="11" font-weight="700" letter-spacing="1.1">OZON E-CUP</text>
      <text x="18" y="37" fill="#f8fafc" font-size="14" font-weight="600">9 место из 678</text>
    </g>
    <g transform="translate(566 213)">
      <rect width="226" height="47" rx="12" fill="#111e33" stroke="#8b5cf6" stroke-opacity="0.38"/>
      <text x="18" y="20" fill="#c4b5fd" font-size="11" font-weight="700" letter-spacing="1.1">ML-ХАКАТОНЫ</text>
      <text x="18" y="37" fill="#f8fafc" font-size="14" font-weight="600">2 первых места</text>
    </g>
    <g transform="translate(808 213)">
      <rect width="251" height="47" rx="12" fill="#111e33" stroke="#22d3ee" stroke-opacity="0.34"/>
      <text x="18" y="20" fill="#67e8f9" font-size="11" font-weight="700" letter-spacing="1.1">RAG-ИССЛЕДОВАНИЕ</text>
      <text x="18" y="37" fill="#f8fafc" font-size="14" font-weight="600">ROC-AUC 0.849</text>
    </g>
  </g>

  <!-- Небольшой авторский мотив: узлы пайплайна -->
  <g transform="translate(1080 70)" fill="none" stroke="#22d3ee" stroke-opacity="0.55">
    <path d="M0 20L42 0l42 22v48L42 92 0 70z"/>
    <circle cx="0" cy="20" r="4" fill="#22d3ee"/>
    <circle cx="42" cy="0" r="4" fill="#8b5cf6" stroke="none"/>
    <circle cx="84" cy="22" r="4" fill="#22d3ee"/>
    <circle cx="42" cy="92" r="4" fill="#8b5cf6" stroke="none"/>
    <path d="M0 20l42 24 42-22M42 44v48" stroke-opacity="0.28"/>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
